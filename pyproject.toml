[project]
name = "ea1rkv-web"
version = "1.0.0"
description = "Wagtail website for EA1RKV - Vigo Val Miñor Radioclub"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "DJ",    # flake8-django
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ea1rkv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ea1rkv.settings.dev"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120

[tool.coverage.run]
source = ["ea1rkv"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
