# Production deployment behind a public reverse proxy on an external Docker network.
# Create the external network once with:
#   docker network create ea1rfi-network
services:
  db:
    image: postgres:16-alpine
    container_name: ea1rkv_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ea1rfi-network

  redis:
    image: redis:7-alpine
    container_name: ea1rkv_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ea1rfi-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: ea1rkv_web
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ea1rkv.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ea1rfi-network

  nginx:
    image: nginx:1.27-alpine
    container_name: ea1rkv_nginx
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./docker/nginx/ea1rkv.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ea1rfi-network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  ea1rfi-network:
    external: true
