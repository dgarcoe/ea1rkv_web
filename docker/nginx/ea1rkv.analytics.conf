# Only for the internal Nginx behind the public proxy.
# The public proxy MUST overwrite X-Real-IP with $remote_addr.
map $http_x_real_ip $analytics_client {
    ""      $remote_addr;
    default $http_x_real_ip;
}
map $uri $analytics_public {
    default 1;
    ~^/(admin|django-admin|documents|static|media|health)(/|$) 0;
    /robots.txt 0;
    /sitemap.xml 0;
}
map $http_referer $analytics_referrer {
    default "-";
    ~^(https?://[^/]+)/ $1;
}
# Omit query strings, referrer paths, cookies and authentication data.
log_format analytics '$analytics_client - - [$time_local] '
                     '"$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent '
                     '"$analytics_referrer" "$http_user_agent"';

map $http_x_forwarded_proto $ea1rkv_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream ea1rkv_web {
    server ea1rkv_web:8000;
}

server {
    listen 80;
    access_log /dev/stdout analytics if=$analytics_public;
    server_name _;
    client_max_body_size 200M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://ea1rkv_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ea1rkv_forwarded_proto;
        proxy_redirect off;
    }
}
