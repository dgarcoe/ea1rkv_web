{% load wagtailimages_tags %}

<div class="row g-4 my-4">
    {% for card in self.cards %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm">
            {% if card.image %}
                {% image card.image fill-400x250 class="card-img-top" %}
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ card.title }}</h5>
                <p class="card-text">{{ card.text }}</p>
                {% if card.link %}
                    <a href="{{ card.link }}" class="btn btn-sm btn-outline-primary">Learn more</a>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
