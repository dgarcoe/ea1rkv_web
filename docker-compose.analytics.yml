# Optional overlay for docker-compose.prod.external.yml.
services:
  nginx:
    volumes:
      - ./docker/nginx/ea1rkv.analytics.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  goaccess:
    profiles: [analytics]
    build:
      context: ./docker/goaccess
    # GoAccess checks its current directory for write access even when
    # --output=html writes the report to stdout.
    working_dir: /tmp
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stdin_open: true
